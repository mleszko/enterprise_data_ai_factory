version: "3.9"

services:
  app:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: bash -lc "pip install -r requirements.txt && python -m src.api.app"
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
